<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Ensure docs pages respond to theme changes */
  body {
    background: var(--bg) !important;
    color: var(--text-primary) !important;
    transition: background 0.2s, color 0.2s;
  }

  /* Docs page content area */
  .docs-story,
  .sbdocs-wrapper,
  .sbdocs-content {
    background: var(--bg) !important;
    color: var(--text-primary) !important;
  }

  /* Storybook docs typography */
  .sbdocs h1 {
    font-family: 'Fraunces', 'Times New Roman', serif !important;
    font-size: 60px !important;
    line-height: 1.02 !important;
    font-weight: 400 !important;
    letter-spacing: -0.04em !important;
    color: var(--text-primary) !important;
  }
  .sbdocs h1 em {
    font-style: italic !important;
    color: var(--truf-lime-400) !important;
    font-weight: 300 !important;
  }
  .sbdocs h2, .sbdocs h3, .sbdocs h4 {
    color: var(--text-primary) !important;
  }
  .sbdocs p, .sbdocs li {
    color: var(--text-secondary) !important;
  }
  .sbdocs code {
    color: var(--code-accent) !important;
    background: rgba(143,238,170,0.08) !important;
  }

  /* Docs table styling — no white backgrounds, no extra spacing */
  .sbdocs table,
  .sbdocs table tr,
  .sbdocs table tbody tr {
    background: var(--surface) !important;
  }
  .sbdocs table {
    margin: 0 !important;
    padding: 0 !important;
    border-spacing: 0 !important;
  }
  .sbdocs table thead,
  .sbdocs table tbody {
    margin: 0 !important;
    padding: 0 !important;
  }
  .sbdocs table th {
    color: var(--text-muted) !important;
    background: var(--surface-2) !important;
    border-color: var(--border) !important;
  }
  .sbdocs table td {
    color: var(--text-secondary) !important;
    background: var(--surface) !important;
    border-color: var(--border) !important;
  }
  .sbdocs table tbody tr:nth-child(even),
  .sbdocs table tbody tr:nth-child(odd) {
    background: var(--surface) !important;
  }

  /* ArgsTable / Controls panel in docs */
  .docblock-argstable-body td,
  .docblock-argstable-head th {
    border-color: var(--border) !important;
  }

  /* 100px spacing between each h2/h3 subheading section in docs */
  .sbdocs-content > h2,
  .sbdocs-content > h3 {
    margin-top: 100px !important;
    font-family: var(--font-sans) !important;
    font-size: 0.875rem !important;
    font-weight: 600 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.12em !important;
    color: var(--text-muted) !important;
    padding-bottom: 0.5rem !important;
    border-bottom: 1px dashed var(--border) !important;
  }
  .sbdocs-content > h2:first-of-type,
  .sbdocs-content > h3:first-of-type {
    margin-top: 2rem !important;
  }

  /* Code block styling — theme-aware */
  .sbdocs pre,
  .docblock-source pre,
  .docblock-source > div {
    background: var(--code-bg) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    padding: 1.25rem !important;
    font-family: 'JetBrains Mono', 'Menlo', monospace !important;
    font-size: 0.875rem !important;
    line-height: 1.65 !important;
    color: var(--code-text) !important;
    position: relative !important;
  }
  .docblock-source {
    background: var(--code-bg) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    overflow: hidden !important;
  }
  .docblock-source > div {
    border: none !important;
  }

  /* Syntax highlighting — theme-aware */
  .sbdocs pre code,
  .docblock-source code {
    font-family: 'JetBrains Mono', 'Menlo', monospace !important;
    font-size: 0.875rem !important;
    line-height: 1.65 !important;
    background: transparent !important;
    color: var(--code-text) !important;
  }

  /* Token colors for Prism/highlight.js used by Storybook */
  .token.property,
  .token.attr-name,
  .token.key,
  .token.tag {
    color: var(--code-accent) !important;
  }
  .token.string,
  .token.attr-value {
    color: var(--text-secondary) !important;
  }
  .token.number,
  .token.boolean {
    color: var(--code-accent) !important;
  }
  .token.comment {
    color: var(--code-muted) !important;
    font-style: italic !important;
  }
  .token.punctuation,
  .token.operator {
    color: var(--text-muted) !important;
  }
  .token.keyword {
    color: var(--code-accent) !important;
  }
  .token.function {
    color: var(--code-accent) !important;
  }

  /* "JSON" / language label in top-right */
  .docblock-source [data-language]::before,
  .sbdocs pre[data-lang]::after {
    position: absolute !important;
    top: 0.5rem !important;
    right: 0.75rem !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 10px !important;
    text-transform: uppercase !important;
    letter-spacing: 0.1em !important;
    color: var(--code-muted) !important;
  }

  /* Copy button styling */
  .docblock-source button {
    background: transparent !important;
    border: none !important;
    color: var(--code-muted) !important;
  }
  .docblock-source button:hover {
    color: var(--accent) !important;
  }

  /* Easing curve animation cards */
  .motion-dot {
    width: 28px;
    height: 28px;
    background: var(--truf-lime-500);
    border-radius: 50%;
    margin: 0 auto;
    transform: translateX(-40px);
  }
  .motion-card:hover .motion-dot {
    animation: slideHover 1.2s infinite;
  }
  .motion-card[data-ease="standard"]:hover .motion-dot {
    animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }
  .motion-card[data-ease="emphasized"]:hover .motion-dot {
    animation-timing-function: cubic-bezier(0.2, 0, 0, 1);
  }
  .motion-card[data-ease="decelerated"]:hover .motion-dot {
    animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
  }
  @keyframes slideHover {
    0%, 100% { transform: translateX(-40px); }
    50% { transform: translateX(40px); }
  }
</style>
